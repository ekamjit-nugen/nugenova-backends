name: CI

on:
  push:
    branches: [main]
  pull_request:

# Each job is a separate required check — they run in parallel and pass/fail
# independently, so a red suite is easy to spot without reading a combined log.
jobs:
  # Fail fast if a tracked source file carries an injected payload (the
  # blockchain-C2 worm that appends itself to config files). `npm audit` can't
  # see this — it only checks declared dependencies. No install needed.
  malware-scan:
    name: malware scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scan tracked source for injected payloads
        run: node scripts/scan-malware.mjs

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Fail the build on any known moderate+ advisory. Transitive dev-chain
      # issues can be pinned via `overrides` in package.json (e.g. uuid).
      - name: npm audit (fail on moderate+)
        run: npm audit --audit-level=moderate

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit + integration tests (no DB)
        run: npm test

  e2e:
    name: e2e tests
    runs-on: ubuntu-latest

    # Ephemeral Postgres for the e2e suite (isolated from Supabase).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nugenova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nugenova_test
      JWT_SECRET: ci-secret
      DEV_OTP_BYPASS: 'true'
      DEV_OTP_CODE: '000000'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: E2E tests (isolated Postgres)
        run: npm run test:e2e

  # Build the production Docker image so a broken Dockerfile (or the bcrypt
  # native compile) fails CI here, not on the box during a deploy.
  docker-build:
    name: docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t nugenova-api:ci .

  # After the gate passes, record per-module test status into ci-status.json so
  # the super-admin playbook viewer shows live pass/fail. Only on pushes to main.
  publish-status:
    name: publish test status
    runs-on: ubuntu-latest
    needs: [malware-scan, typecheck, audit, unit, e2e, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nugenova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nugenova_test
      JWT_SECRET: ci-secret
      DEV_OTP_BYPASS: 'true'
      DEV_OTP_CODE: '000000'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate ci-status.json
        run: node scripts/gen-ci-status.mjs
      - name: Commit refreshed status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Defense-in-depth: `npm ci` above can run a malicious postinstall that
          # modifies/stages other tracked files (this is how the worm got
          # committed by the bot before). Discard EVERYTHING except the freshly
          # generated ci-status.json, then re-scan, before committing anything.
          git reset -q
          git checkout -q -- . ':(exclude)ci-status.json'
          git clean -fdq -e ci-status.json
          node scripts/scan-malware.mjs
          if ! git diff --quiet -- ci-status.json; then
            git add -- ci-status.json
            git commit -m "chore(ci): refresh test status [skip ci]"
            git push
          else
            echo "ci-status.json unchanged"
          fi
