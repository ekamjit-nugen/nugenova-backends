name: CI

on:
  push:
    branches: [main]
  pull_request:

# Verify tests FIRST — required merge gate. Nothing merges red.
jobs:
  verify:
    name: typecheck + tests
    runs-on: ubuntu-latest

    # Ephemeral Postgres for integration/e2e tests (isolated from Supabase).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nugenova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nugenova_test
      JWT_SECRET: ci-secret
      DEV_OTP_BYPASS: 'true'
      DEV_OTP_CODE: '000000'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit + integration tests
        run: npm test
      - name: E2E tests (isolated Postgres)
        run: npm run test:e2e
