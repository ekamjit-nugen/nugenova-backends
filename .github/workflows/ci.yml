name: CI

on:
  push:
    branches: [main]
  pull_request:

# Each job is a separate required check — they run in parallel and pass/fail
# independently, so a red suite is easy to spot without reading a combined log.
jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit + integration tests (no DB)
        run: npm test

  e2e:
    name: e2e tests
    runs-on: ubuntu-latest

    # Ephemeral Postgres for the e2e suite (isolated from Supabase).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nugenova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nugenova_test
      JWT_SECRET: ci-secret
      DEV_OTP_BYPASS: 'true'
      DEV_OTP_CODE: '000000'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: E2E tests (isolated Postgres)
        run: npm run test:e2e
