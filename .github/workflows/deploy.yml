name: Deploy

# Deploy to the production API box (prod-api.nugenova.com) only AFTER the CI
# workflow has finished successfully on main. Also runnable on demand from the
# Actions tab (workflow_dispatch) for hotfixes / rollbacks.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_dispatch always deploys; workflow_run only when CI passed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # Until the DEPLOY_* secrets are configured, skip the SSH step cleanly
      # instead of failing every run.
      - name: Check deploy is configured
        id: cfg
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DEPLOY_HOST not set — skipping deploy. Add the DEPLOY_* secrets to enable (see DEPLOYMENT.md §2)."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH (Docker)
        if: steps.cfg.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: DEPLOY_PATH
          script_stop: true
          script: |
            set -euo pipefail
            # docker/compose live in /usr/bin; make them resolvable non-interactively.
            export PATH="$PATH:/usr/local/bin:/usr/bin"

            # Where the repo is cloned. Defaults to ~/nugenova-api; override by
            # setting a DEPLOY_PATH repo secret (e.g. /root/nugenova-api).
            cd "${DEPLOY_PATH:-$HOME/nugenova-api}"

            echo "→ Fetching latest main"
            git fetch --all --prune
            git reset --hard origin/main

            echo "→ Building the image"
            docker compose build

            # Migrations run as an explicit one-off container BEFORE the swap, so a
            # failed migration fails the deploy (the old container keeps serving).
            # RUN_MIGRATIONS=false stops the entrypoint running them a second time —
            # the API container's entrypoint applies them on every start as a backstop
            # (e.g. a manual `docker compose up -d` that skips this job).
            echo "→ Running migrations"
            docker compose run --rm -e RUN_MIGRATIONS=false api npm run migration:run

            echo "→ Starting/replacing the API container"
            docker compose up -d

            echo "→ Pruning dangling images"
            docker image prune -f

            echo "✅ Deploy complete"
