name: Deploy

# Deploy to the production API box (prod-api.nugenova.com) only AFTER the CI
# workflow has finished successfully on main. Also runnable on demand from the
# Actions tab (workflow_dispatch) for hotfixes / rollbacks.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_dispatch always deploys; workflow_run only when CI passed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # Until the DEPLOY_* secrets are configured, skip the SSH step cleanly
      # instead of failing every run.
      - name: Check deploy is configured
        id: cfg
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DEPLOY_HOST not set — skipping deploy. Add the DEPLOY_* secrets to enable (see DEPLOYMENT.md §2)."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH (Docker)
        if: steps.cfg.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: DEPLOY_PATH
          script_stop: true
          script: |
            set -euo pipefail
            # docker/compose live in /usr/bin; make them resolvable non-interactively.
            export PATH="$PATH:/usr/local/bin:/usr/bin"

            # Where the repo is cloned. Defaults to ~/nugenova-api; override by
            # setting a DEPLOY_PATH repo secret (e.g. /root/nugenova-api).
            cd "${DEPLOY_PATH:-$HOME/nugenova-api}"

            echo "→ Fetching latest main"
            git fetch --all --prune
            git reset --hard origin/main

            # The commit we are deploying: baked into the container's environment
            # so /api/v1/health can prove which build is actually serving.
            export APP_GIT_SHA="$(git rev-parse HEAD)"
            echo "→ Deploying $APP_GIT_SHA"

            echo "→ Building the image"
            docker compose build

            # Migrations run as an explicit one-off container BEFORE the swap, so a
            # failed migration fails the deploy (the old container keeps serving).
            # RUN_MIGRATIONS=false stops the entrypoint running them a second time —
            # the API container's entrypoint applies them on every start as a backstop
            # (e.g. a manual `docker compose up -d` that skips this job).
            echo "→ Running migrations"
            docker compose run --rm -e RUN_MIGRATIONS=false api npm run migration:run

            echo "→ Starting/replacing the API container"
            docker compose up -d

            # Migrations have already run, so an old container left serving would
            # answer every request with "relation ... does not exist" while looking
            # alive. Prove the swap took before calling this a deploy: health must
            # report the commit we just built and a schema that matches it.
            echo "→ Verifying the running container"
            PORT="$(grep -E '^PORT=' .env | head -1 | cut -d= -f2 | tr -d '\r\"' || true)"
            HEALTH="http://127.0.0.1:${PORT:-4100}/api/v1/health"
            ok=false
            for attempt in $(seq 1 30); do
              body="$(curl -fsS --max-time 5 "$HEALTH" || true)"
              case "$body" in
                *'"version":"'"$APP_GIT_SHA"'"'*)
                  case "$body" in
                    *'"status":"ok"'*) ok=true; break ;;
                    *) echo "   attempt $attempt: running the right build but not healthy — $body" ;;
                  esac
                  ;;
                '') echo "   attempt $attempt: no answer yet" ;;
                *) echo "   attempt $attempt: still the old build — $body" ;;
              esac
              sleep 4
            done

            if [ "$ok" != true ]; then
              echo "::error::Deploy did NOT take: $HEALTH never reported status=ok for $APP_GIT_SHA."
              echo "The database is already migrated, so the container that is serving is out of date — fix it now."
              docker compose ps || true
              docker compose logs --tail=120 api || true
              exit 1
            fi
            echo "   healthy on $APP_GIT_SHA"

            echo "→ Pruning dangling images"
            docker image prune -f

            echo "✅ Deploy complete"
