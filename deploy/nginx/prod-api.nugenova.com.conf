# nginx site for the Nugenova production API.
#
# Install:
#   sudo cp deploy/nginx/prod-api.nugenova.com.conf /etc/nginx/sites-available/prod-api.nugenova.com
#   sudo ln -s /etc/nginx/sites-available/prod-api.nugenova.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d prod-api.nugenova.com     # adds the 443 server + HTTP->HTTPS redirect
#
# After certbot runs, this file is rewritten to listen on 443 with the Let's
# Encrypt cert and a port-80 redirect. Nothing else to change.

server {
    listen 80;
    listen [::]:80;
    server_name prod-api.nugenova.com;

    # Onboarding document uploads are capped at 25 MB by the app; give headroom.
    client_max_body_size 30m;

    # Reasonable timeouts for API calls (uploads, presign, etc.).
    proxy_connect_timeout 30s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # Preserve the real client + scheme so the app (behind trust proxy) sees
        # the true IP and knows the request arrived over HTTPS.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket-ready (harmless for plain HTTP; future-proofs realtime).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
