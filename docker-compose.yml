# Production compose for the Nugenova API (prod-api.nugenova.com).
#
# Postgres is managed (Supabase) — there is NO database container here. The app
# reads every secret from the box's `.env` (DATABASE_URL, JWT_SECRET, PORT, …).
# The published port is bound to host LOOPBACK only, so nginx (same host, with
# the Let's Encrypt cert) is the sole public entrypoint → 127.0.0.1:${PORT}.
services:
  api:
    build: .
    image: nugenova-api:latest
    container_name: nugenova-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # The entrypoint applies pending migrations before the API starts; set to
      # "false" only for a one-off container that must not touch the schema.
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      # Bind all interfaces INSIDE the container so the port mapping works; the
      # mapping below still only exposes it on the host's loopback.
      HOST: 0.0.0.0
      # The commit this container is serving, reported by /api/v1/health so a
      # deploy can prove the swap took (empty for a hand-rolled `up -d`).
      APP_GIT_SHA: ${APP_GIT_SHA:-}
    ports:
      - "127.0.0.1:${PORT:-4100}:${PORT:-4100}"
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const p=process.env.PORT||4100;require('http').get('http://127.0.0.1:'+p+'/api/v1/health',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s # room for migrations to run before the first health check
